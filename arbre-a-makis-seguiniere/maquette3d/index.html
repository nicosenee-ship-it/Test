<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquette 3D L'Arbre à Makis</title>
<style>
  :root { --bg:#f4f1ea; --ink:#13213c; --muted:#5b6475; --panel:#ffffffee; --line:#d9d3c7; --accent:#8cc63f; --btn:#13213c; --btnInk:#fff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0f1626; --ink:#eef2f8; --muted:#a8b2c4; --panel:#162036ee; --line:#2a3550; --btn:#8cc63f; --btnInk:#0f1626; } }
  :root[data-theme="dark"] { --bg:#0f1626; --ink:#eef2f8; --muted:#a8b2c4; --panel:#162036ee; --line:#2a3550; --btn:#8cc63f; --btnInk:#0f1626; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; overflow:hidden; }
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  #ui { position:fixed; left:16px; right:16px; top:16px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; pointer-events:none; }
  #ui > * { pointer-events:auto; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 12px; backdrop-filter: blur(6px); }
  h1 { font-size:15px; margin:0 0 2px; letter-spacing:.2px; }
  .sub { font-size:12px; color:var(--muted); margin:0; }
  .views { display:flex; flex-wrap:wrap; gap:6px; }
  button { font:inherit; font-size:12.5px; border:1px solid var(--line); background:var(--panel); color:var(--ink); padding:7px 10px; border-radius:999px; cursor:pointer; }
  button.on { background:var(--btn); color:var(--btnInk); border-color:var(--btn); }
  #hint { position:fixed; left:16px; bottom:16px; font-size:12px; color:var(--muted); }
  body.still #ui, body.still #hint { display:none; }
  @media (max-width: 640px) { .card { padding:8px 10px; } h1 { font-size:14px; } button { font-size:12px; padding:6px 9px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div class="card"><h1>L'Arbre à Makis — cellule 09, La Séguinière</h1><p class="sub">Maquette d'intention (plan V3) — salle + laboratoire</p></div>
  <div class="card views" id="views"></div>
</div>
<div id="hint">Glisser pour tourner · molette / pincer pour zoomer · clic droit pour déplacer</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/environments/RoomEnvironment.js"></script>
<script>
(function () {
const Q = new URLSearchParams(location.search);
const STILL = Q.get('still') === '1';
if (STILL) document.body.classList.add('still');
const VIEW0 = Q.get('view') || 'axo';
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
const W0 = STILL ? +(Q.get('w') || 2400) : innerWidth, H0 = STILL ? +(Q.get('h') || 1500) : innerHeight;
renderer.setPixelRatio(STILL ? 1 : Math.min(devicePixelRatio, 2));
renderer.setSize(W0, H0, !STILL);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = .92;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#e8ebee');
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new THREE.RoomEnvironment(), 0.04).texture;

// ------------------------------------------------------------------ textures procédurales
function tex(w, h, draw, rx = 1, ry = 1) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry);
  t.encoding = THREE.sRGBEncoding; t.anisotropy = 8; return t;
}
function rnd(a) { let s = a; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
function woodDraw(base, dark, light, vertical) {
  return (x, w, h) => {
    x.fillStyle = base; x.fillRect(0, 0, w, h); const r = rnd(7);
    for (let i = 0; i < 140; i++) {
      x.strokeStyle = r() < .5 ? dark : light; x.globalAlpha = .12 + r() * .18; x.lineWidth = 1 + r() * 2.5;
      const p = r() * (vertical ? w : h); x.beginPath();
      for (let t = 0; t <= 1.0001; t += .05) {
        const a = t * (vertical ? h : w), o = Math.sin(t * 6 + p) * 3 + Math.sin(t * 17 + p * 2) * 1.2;
        if (vertical) (t === 0 ? x.moveTo(p + o, a) : x.lineTo(p + o, a)); else (t === 0 ? x.moveTo(a, p + o) : x.lineTo(a, p + o));
      }
      x.stroke();
    }
    x.globalAlpha = 1;
  };
}
const T = {
  oak: tex(512, 512, woodDraw('#d8b98a', '#a87f4f', '#ecd3a8', false)),
  oakV: tex(256, 512, woodDraw('#d2b07c', '#9c7446', '#e9cf9f', true)),
  stone: tex(512, 512, (x, w, h) => {
    const r = rnd(3); for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) {
      const v = 206 + Math.floor(r() * 10); x.fillStyle = `rgb(${v},${v - 8},${v - 22})`; x.fillRect(i * w / 2, j * h / 2, w / 2, h / 2);
      for (let k = 0; k < 400; k++) { x.fillStyle = `rgba(150,130,100,${r() * .08})`; x.fillRect(i * w / 2 + r() * w / 2, j * h / 2 + r() * h / 2, 2, 2); }
    }
    x.strokeStyle = '#cfc6b6'; x.lineWidth = 3; x.strokeRect(0, 0, w / 2, h / 2); x.strokeRect(w / 2, 0, w / 2, h / 2); x.strokeRect(0, h / 2, w / 2, h / 2); x.strokeRect(w / 2, h / 2, w / 2, h / 2);
  }),
  tile: tex(256, 256, (x, w, h) => {
    const r = rnd(5); for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) { const v = 150 + Math.floor(r() * 14); x.fillStyle = `rgb(${v},${v + 2},${v + 5})`; x.fillRect(i * 64, j * 64, 64, 64); }
    x.strokeStyle = '#8e9296'; x.lineWidth = 3; for (let i = 0; i <= 4; i++) { x.beginPath(); x.moveTo(i * 64, 0); x.lineTo(i * 64, h); x.stroke(); x.beginPath(); x.moveTo(0, i * 64); x.lineTo(w, i * 64); x.stroke(); }
  }),
  panel: tex(256, 256, (x, w, h) => { x.fillStyle = '#f3f4f2'; x.fillRect(0, 0, w, h); x.fillStyle = '#dfe1df'; x.fillRect(0, 0, 3, h); }),
  ceilGrid: tex(256, 256, (x, w, h) => { x.fillStyle = '#f2f2ef'; x.fillRect(0, 0, w, h); x.strokeStyle = '#d6d6d1'; x.lineWidth = 4; x.strokeRect(0, 0, w, h); }),
  pave: tex(256, 256, (x, w, h) => { x.fillStyle = '#76787c'; x.fillRect(0, 0, w, h); const r = rnd(9); for (let i = 0; i < 4; i++) for (let j = 0; j < 8; j++) { const v = 105 + Math.floor(r() * 18); x.fillStyle = `rgb(${v},${v},${v + 3})`; x.fillRect(i * 64 + (j % 2) * 32, j * 32, 64, 32); } x.strokeStyle = '#8b8d90'; x.lineWidth = 1; for (let j = 0; j <= 8; j++) { x.beginPath(); x.moveTo(0, j * 32); x.lineTo(w, j * 32); x.stroke(); } }),
};
function textTex(lines, o = {}) {
  const w = o.w || 1024, h = o.h || 256;
  return tex(w, h, (x) => {
    x.fillStyle = o.bg || 'rgba(0,0,0,0)'; x.clearRect(0, 0, w, h); if (o.bg) x.fillRect(0, 0, w, h);
    x.fillStyle = o.color || '#13213c'; x.textAlign = o.align || 'center'; x.textBaseline = 'middle';
    lines.forEach((l, i) => { x.font = (l.font || o.font || 'italic 600 90px "Caveat", "Segoe Script", "FreeSerif", serif'); if (l.color) x.fillStyle = l.color; x.fillText(l.t || l, o.align === 'left' ? 40 : w / 2, (i + .5) * h / lines.length); x.fillStyle = o.color || '#13213c'; });
  });
}

// ------------------------------------------------------------------ matériaux
const M = (p) => { const m = new THREE.MeshStandardMaterial(Object.assign({ roughness: .7, metalness: 0, envMapIntensity: .32 }, p)); return m; };
const mat = {
  cream: M({ color: '#e6dccb', roughness: .9 }), white: M({ color: '#ecedeb', map: T.panel, roughness: .45 }),
  navy: M({ color: '#13213c', roughness: .8 }), navyFab: M({ color: '#1b2c4d', roughness: .95 }),
  oak: M({ map: T.oak, roughness: .55 }), oakV: M({ map: T.oakV, roughness: .55 }),
  black: M({ color: '#1d1f22', roughness: .5 }), steel: M({ color: '#a3aab0', metalness: .85, roughness: .26, envMapIntensity: 1.15 }),
  steelDark: M({ color: '#7f868c', metalness: .7, roughness: .4 }),
  glass: new THREE.MeshPhysicalMaterial({ color: '#cfe5ef', transparent: true, opacity: .16, roughness: .05, metalness: 0, depthWrite: false, envMapIntensity: 1 }),
  glassDark: new THREE.MeshPhysicalMaterial({ color: '#1a2a33', transparent: true, opacity: .55, roughness: .1, depthWrite: false }),
  stone: M({ map: T.stone, roughness: .6 }), tile: M({ map: T.tile, roughness: .75 }), pave: M({ map: T.pave, roughness: .9 }),
  quartz: M({ color: '#f2efe9', roughness: .25 }), green: M({ color: '#4c8a2e', roughness: .85 }), green2: M({ color: '#6aa338', roughness: .85 }),
  green3: M({ color: '#2f6327', roughness: .85 }), terra: M({ color: '#c06b4a', roughness: .9 }), grey: M({ color: '#9aa0a6', roughness: .7 }),
  kraft: M({ color: '#c49a62', roughness: .9 }), ceil: M({ color: '#e9e4da', roughness: .95 }), ceilGrid: M({ map: T.ceilGrid, roughness: .9 }),
  glow: new THREE.MeshBasicMaterial({ color: '#fff3d6' }), fridgeIn: M({ color: '#ffffff', emissive: '#f4f8ff', emissiveIntensity: .55 }),
  red: M({ color: '#b8402e' }), salmon: M({ color: '#ec8a62' }), avocado: M({ color: '#9ccc65' }), rice: M({ color: '#fbfaf5', roughness: .9 }),
};
const CAP = new THREE.MeshStandardMaterial({ color: '#4a4f57', roughness: .9 });
const G = { ceil: new THREE.Group(), high: new THREE.Group(), cut: [] };
scene.add(G.ceil); scene.add(G.high);

// ------------------------------------------------------------------ helpers (plan en cm, x = profondeur, y = largeur)
function box(x1, y1, x2, y2, z0, z1, m, o = {}) {
  const w = Math.max(Math.abs(x2 - x1) / 100, .005), d = Math.max(Math.abs(y2 - y1) / 100, .005), h = Math.max(z1 - z0, .005);
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
  mesh.position.set((x1 + x2) / 200, z0 + h / 2, (y1 + y2) / 200);
  mesh.castShadow = o.cast !== false; mesh.receiveShadow = true;
  (o.group || scene).add(mesh); return mesh;
}
// mur : face « + » (x ou y plus grand) = mA, face « − » = mB ; cut = coupé en vue axonométrique
function wall(x1, y1, x2, y2, z0, z1, mA, mB, t = 10, o = {}) {
  let m;
  if (x1 === x2) { const ms = [mA, mB, CAP, mA, mA, mA]; m = box(x1 - t / 2, y1, x1 + t / 2, y2, z0, z1, ms, o); }
  else if (y1 === y2) { const ms = [mA, mA, CAP, mA, mA, mB]; m = box(x1, y1 - t / 2, x2, y1 + t / 2, z0, z1, ms, o); }
  else {
    const L = Math.hypot(x2 - x1, y2 - y1) / 100, h = z1 - z0;
    m = new THREE.Mesh(new THREE.BoxGeometry(L, h, t / 100), mA); m.position.set((x1 + x2) / 200, z0 + h / 2, (y1 + y2) / 200);
    m.rotation.y = -Math.atan2(y2 - y1, x2 - x1); m.castShadow = m.receiveShadow = true; scene.add(m);
  }
  if (o.cut !== false) G.cut.push({ m, z0, z1 });
  return m;
}
function plane(x1, y1, x2, y2, z, m, rep, group) {
  const w = (x2 - x1) / 100, d = (y2 - y1) / 100; const mm = m.clone();
  if (mm.map) { mm.map = m.map.clone(); mm.map.needsUpdate = true; mm.map.repeat.set(w / rep, d / rep); }
  const p = new THREE.Mesh(new THREE.PlaneGeometry(w, d), mm); p.rotation.x = -Math.PI / 2;
  p.position.set((x1 + x2) / 200, z, (y1 + y2) / 200); p.receiveShadow = true; (group || scene).add(p); return p;
}
function decal(x, y, z, w, h, rotY, texture, opts = {}) {
  const m = new THREE.MeshStandardMaterial({ map: texture, transparent: true, roughness: .9, emissive: opts.emissive ? '#ffffff' : '#000000', emissiveMap: opts.emissive ? texture : null, emissiveIntensity: opts.emissive || 0 });
  const p = new THREE.Mesh(new THREE.PlaneGeometry(w, h), opts.basic ? new THREE.MeshBasicMaterial({ map: texture, transparent: true }) : m);
  p.position.set(x / 100, z, y / 100); p.rotation.y = rotY; (opts.group || scene).add(p); return p;
}
function cyl(x, y, r, z0, z1, m, seg = 24, o = {}) {
  const c = new THREE.Mesh(new THREE.CylinderGeometry(r, o.r2 !== undefined ? o.r2 : r, z1 - z0, seg), m);
  c.position.set(x / 100, (z0 + z1) / 2, y / 100); c.castShadow = o.cast !== false; c.receiveShadow = true; (o.group || scene).add(c); return c;
}
function cbox(x1, y1, x2, y2, z0, z1, m, o) { const b = box(x1, y1, x2, y2, z0, z1, m, o); G.cut.push({ m: b, z0, z1 }); return b; }
function sphere(x, y, z, r, m, o = {}) { const s = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), m); s.position.set(x / 100, z, y / 100); s.castShadow = o.cast !== false; (o.group || scene).add(s); return s; }
function slats(x1, y1, x2, y2, z0, z1, axis, step = 6, wd = 3.5, depth = 3, m = mat.oakV) {
  // lattes verticales le long d'un axe ('x' ou 'y'), saillie depth cm côté +/− selon signe
  const L = axis === 'y' ? Math.abs(y2 - y1) : Math.abs(x2 - x1), n = Math.floor(L / step);
  const geo = new THREE.BoxGeometry(axis === 'y' ? Math.abs(depth) / 100 : wd / 100, z1 - z0, axis === 'y' ? wd / 100 : Math.abs(depth) / 100);
  const im = new THREE.InstancedMesh(geo, m, n); const d = new THREE.Object3D();
  for (let i = 0; i < n; i++) {
    const t = (i + .5) * step;
    if (axis === 'y') d.position.set((x1 + depth / 2) / 100, (z0 + z1) / 2, (Math.min(y1, y2) + t) / 100);
    else d.position.set((Math.min(x1, x2) + t) / 100, (z0 + z1) / 2, (y1 + depth / 2) / 100);
    d.updateMatrix(); im.setMatrixAt(i, d.matrix);
  }
  im.castShadow = true; im.receiveShadow = true; scene.add(im); return im;
}

// ------------------------------------------------------------------ sols, plafonds, extérieur
const HC = 2.8;
plane(-900, -400, 1800, 1550, -0.02, M({ color: '#cfd3d4', roughness: 1 }));        // sol extérieur
plane(-625, 0, 0, 1150, 0.0, mat.pave, 2.4);                                          // terrasse sous auvent
[[0, 0, 655, 1150], [655, 0, 983, 427]].forEach(r => plane(...r, 0.002, mat.stone, 1.2));
[[655, 427, 1545, 1150], [983, 0, 1545, 427]].forEach(r => plane(...r, 0.001, mat.tile, .8));
plane(1058, 830, 1370, 1150, 0.14, M({ color: '#e9eef2', roughness: .5 }));           // sol chambre froide
// plafonds (vues intérieures)
[[0, 0, 983, 427], [0, 427, 655, 1150]].forEach(r => { const p = plane(...r, HC, mat.ceil, 1, G.ceil); p.rotation.x = Math.PI / 2; p.receiveShadow = false; });
[[655, 427, 1545, 1150], [983, 0, 1545, 427]].forEach(r => { const p = plane(...r, HC, mat.ceilGrid, .6, G.ceil); p.rotation.x = Math.PI / 2; p.receiveShadow = false; });

// murs extérieurs (mitoyens) et fond
const ext = M({ color: '#3b3f46', roughness: .9 });
const TOPWALL = [wall(-20, -12, 1570, -12, 0, HC, mat.cream, ext, 25)];
wall(-20, 1162, 1570, 1162, 0, HC, ext, mat.cream, 25);
[[0, 15], [115, 640], [740, 1150]].forEach(([a, b]) => wall(1557, a, 1557, b, 0, HC, ext, mat.white, 25));
[[15, 115], [640, 740]].forEach(([a, b]) => { cbox(1546, a, 1552, b, 0, 2.1, M({ color: '#7d8590', metalness: .4, roughness: .5 })); box(1545, a + 8, 1546, b - 8, 1.0, 1.05, mat.steelDark); wall(1557, a, 1557, b, 2.1, HC, ext, mat.white, 25); });
// teinte crème côté salle pour les premiers mètres des murs latéraux, blanc côté labo
TOPWALL.push(wall(655, 1.6, 1545, 1.6, 0, HC, mat.white, mat.white, 2));
wall(655, 1148.4, 1545, 1148.4, 0, HC, mat.white, mat.white, 2);
// façade vitrée
const mull = mat.black;
[[0, 455], [695, 1150]].forEach(([a, b]) => {
  box(-3, a, 3, b, 0, HC, mat.glass, { cast: false }); G.cut.push({ m: scene.children[scene.children.length - 1], z0: 0, z1: HC });
  for (let y = a; y <= b; y += (b - a) / 2) { const mm = box(-4, y - 3, 4, y + 3, 0, HC, mull); G.cut.push({ m: mm, z0: 0, z1: HC }); }
});
[455, 575, 695].forEach(y => { const mm = box(-4, y - 3, 4, y + 3, 0, 2.6, mull); G.cut.push({ m: mm, z0: 0, z1: 2.6 }); });
cbox(-3, 455, 3, 695, 2.6, HC, mat.glass, { cast: false });
[[460, 570], [580, 690]].forEach(([a, b]) => { const d = box(-2, a, 2, b, 0, 2.6, mat.glass, { cast: false }); G.cut.push({ m: d, z0: 0, z1: 2.6 }); box(-6, (a + b) / 2 - 2, -2, (a + b) / 2 + 2, .8, 1.6, mat.steel); });
// bandes contrastées PMR (vitrophanie)
[1.1, 1.6].forEach(z => [[0, 455], [695, 1150]].forEach(([a, b]) => box(-4.5, a, -3.5, b, z, z + .05, mat.navy, { cast: false })));
// terrasse : 4 tables + chaises
function chair(x, y, rot, m = mat.black) {
  const g = new THREE.Group(); const s = new THREE.Mesh(new THREE.BoxGeometry(.42, .04, .42), m); s.position.y = .46; g.add(s);
  const b = new THREE.Mesh(new THREE.BoxGeometry(.42, .42, .03), m); b.position.set(0, .7, -.2); g.add(b);
  [[-.18, -.18], [.18, -.18], [-.18, .18], [.18, .18]].forEach(([a, c]) => { const l = new THREE.Mesh(new THREE.CylinderGeometry(.012, .012, .46, 6), mat.black); l.position.set(a, .23, c); g.add(l); });
  g.position.set(x / 100, 0, y / 100); g.rotation.y = rot; g.traverse(o => { o.castShadow = true; }); scene.add(g); return g;
}
function table(x1, y1, x2, y2, h = .75) { box(x1, y1, x2, y2, h - .035, h, mat.oak); cyl((x1 + x2) / 2, (y1 + y2) / 2, .03, 0, h - .035, mat.black, 8); box((x1 + x2) / 2 - 22, (y1 + y2) / 2 - 22, (x1 + x2) / 2 + 22, (y1 + y2) / 2 + 22, 0, .02, mat.black); }
[[-480, 200], [-480, 520], [-480, 760], [-480, 1000], [-230, 200], [-230, 1000]].forEach(([x, y], i) => {
  if (i > 3) return; table(x - 35, y - 35, x + 35, y + 35);
  chair(x, y - 70, 0, M({ color: '#2b3a55' })); chair(x, y + 70, Math.PI, M({ color: '#2b3a55' }));
});
[[-560, 80], [-560, 1080]].forEach(([x, y]) => { cyl(x, y, .28, 0, .55, mat.navy); for (let i = 0; i < 9; i++) sphere(x + Math.cos(i) * 18, y + Math.sin(i * 1.7) * 18, .75 + (i % 3) * .18, .2, i % 2 ? mat.green : mat.green3); });

// ------------------------------------------------------------------ cloisons du back-office (existantes) + ouvertures V3
const W = mat.white, C = mat.cream;
wall(983, 0, 983, 90, 0, HC, W, C); wall(983, 90, 983, 170, 0, .9, W, C); wall(983, 90, 983, 170, 1.45, HC, W, C);
box(978, 90, 988, 170, .9, .93, mat.steel);                                          // appui passe desserte
wall(983, 170, 983, 427, 0, HC, W, C); wall(983, 427, 983, 690, 0, HC, W, W);
wall(655, 427, 983, 427, 0, HC, W, C);                                               // prépa / alcôve
wall(655, 733, 930, 733, 0, HC, W, W); wall(655, 837, 741, 837, 0, HC, W, W);
wall(893, 948, 893, 1150, 0, HC, W, W);                                              // muret cuisson
wall(983, 200, 1050, 200, 0, HC, W, W); wall(1140, 200, 1160, 200, 0, HC, W, W); wall(1050, 200, 1140, 200, 2.1, HC, W, W);
wall(1160, 0, 1160, 610, 0, HC, W, W); wall(1160, 690, 1160, 700, 0, HC, W, W); wall(1160, 610, 1160, 690, 2.1, HC, W, W);
[[0, 20], [100, 150], [230, 320], [400, 540], [630, 700]].forEach(([a, b]) => wall(1395, a, 1395, b, 0, HC, W, W));
[[20, 100], [150, 230], [320, 400], [540, 630]].forEach(([a, b]) => wall(1395, a, 1395, b, 2.1, HC, W, W));
wall(1160, 445, 1395, 445, 0, HC, W, W); wall(1160, 700, 1395, 700, 0, HC, W, W);
